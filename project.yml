name: AerialRemote
options:
  bundleIdPrefix: tv.aerial
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: "NO"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  AerialRemote:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: app
    dependencies:
      # 控制中心那颗「遥控器」：iOS 18 的 ControlWidget 必须活在扩展里
      - target: RemoteWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.aerial.remote
        PRODUCT_NAME: AerialRemote
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    info:
      path: app/Info.plist
      properties:
        CFBundleDisplayName: 遥控器
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 需要访问局域网里的电视遥控服务（aerial.local:8899）。
        NSBonjourServices:
          - _http._tcp
    scheme:
      testTargets: []

  RemoteWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: app_widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.aerial.remote.widgets
        PRODUCT_NAME: RemoteWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    info:
      path: app_widget/Info.plist
      properties:
        CFBundleDisplayName: 遥控器
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
